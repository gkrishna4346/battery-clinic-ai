<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battery Clinic AI · Visualized</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Monoton&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5; --panel:#FFFFFF; --ink:#14203F; --muted:#5E687C; --line:#D5DAE3; --chip:#F2F4F8;
  --navy:#1B2A5B; --navy-deep:#0F1A3C; --org:#EE7B22; --org-ink:#B9580C; --org-soft:#FFF0E2;
  --grey:#8A93A6; --grey-soft:#EEF0F4; --red:#C62828; --red-soft:#FDECEA;
  --navy-soft:#E6EBF7; --cell:#FFFFFF; --cellhead:#F2F4F8;
  --sans:'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gap:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1330; --panel:#121E46; --ink:#E7EBF6; --muted:#9AA6C4; --line:#24346B; --chip:#1A295A;
  --navy:#9DB2F0; --navy-deep:#0B1535; --org:#FF9A45; --org-ink:#FFAA5E; --org-soft:#3A2616;
  --grey:#8C97B5; --grey-soft:#1A2753; --red:#FF6B6B; --red-soft:#3A1720; --navy-soft:#1A295A;
  --cell:#0F1A3E; --cellhead:#16244F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1330; --panel:#121E46; --ink:#E7EBF6; --muted:#9AA6C4; --line:#24346B; --chip:#1A295A;
  --navy:#9DB2F0; --navy-deep:#0B1535; --org:#FF9A45; --org-ink:#FFAA5E; --org-soft:#3A2616;
  --grey:#8C97B5; --grey-soft:#1A2753; --red:#FF6B6B; --red-soft:#3A1720; --navy-soft:#1A295A;
  --cell:#0F1A3E; --cellhead:#16244F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:13px}
button{font:inherit;color:inherit}
.mono,code{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--org);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;padding:1vh 1vw;display:grid;grid-template-rows:auto 1fr auto;gap:var(--gap)}
header{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;column-gap:18px;min-height:46px}
.brand{font-family:'Monoton','Schibsted Grotesk',system-ui,sans-serif;font-size:clamp(1.6rem,2.4vw,2.1rem);line-height:1;letter-spacing:.02em;color:var(--navy);user-select:none}
:root[data-theme="dark"] .brand{color:var(--org)}
h1{margin:0;color:var(--org-ink);font-size:clamp(1.2rem,2.2vw,1.9rem);font-weight:700;letter-spacing:-.025em;line-height:1}
h1 small{font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .where{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.25}
.stepper .where b{display:block;color:var(--ink);font-size:13.5px}
.pbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;flex:none}
.pbtn svg{width:16px;height:16px}
.pbtn.primary{background:var(--org);border-color:transparent;color:#fff}
.pbtn:disabled{opacity:.4;cursor:default}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:18px;height:18px}
:root[data-theme="dark"] .theme-btn{background:var(--org);color:#0A1330;border-color:transparent}
.site-foot{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.site-foot a{color:var(--org-ink);text-decoration:none;font-weight:600}

.main{display:grid;grid-template-columns:minmax(220px,15fr) 85fr;gap:var(--gap);min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;flex:none;min-height:38px}
.panel-head .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px;text-align:right}
.panel-body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column}
.pad{padding:10px 12px}
.note{flex:none;border-top:1px solid var(--line);background:var(--org-soft);color:var(--ink);font-size:12.5px;line-height:1.4;padding:7px 12px 7px 10px;border-left:3px solid var(--org)}
.note b{color:var(--org-ink)}

/* sidebar */
.side .panel-body{padding:6px;gap:5px}
.sec{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:0;cursor:pointer;padding:7px 10px;border-radius:8px;background:var(--navy-deep);color:#8F9BB8;font-size:11.5px;line-height:1.3}
:root[data-theme="dark"] .sec{background:#1C2C66}
.sec .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--org);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.sec b{display:block;color:#F3F5FA;font-size:13px;font-weight:600}
.sec[aria-current="true"]{box-shadow:inset 3px 0 0 var(--org)}
.items{list-style:none;margin:3px 0 2px;padding:0 0 0 8px}
.items button{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:12.5px;display:flex;gap:6px}
.items button:hover{background:var(--chip)}
.items button[aria-current="true"]{background:var(--org-soft);color:var(--org-ink);font-weight:600}
.active-card{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--chip);font-size:12px;color:var(--muted);line-height:1.45}
.active-card b{color:var(--ink);font-size:13px}
.active-card .big{font:600 18px var(--mono);color:var(--org-ink)}

/* dashboard */
.body{display:grid;gap:var(--gap);min-height:0;min-width:0}

/* generic bits */
.cv{flex:1 1 0;min-height:110px;overflow:hidden;position:relative}
svg.chart{display:block}
svg .gl{stroke:var(--line);stroke-width:1}
svg .ax{stroke:var(--grey);stroke-width:1}
svg .tk{fill:var(--muted);font-size:10.5px;font-family:var(--sans)}
svg .al{fill:var(--muted);font-size:11px;font-weight:600;font-family:var(--sans)}
svg .lb{fill:var(--ink);font-size:11px;font-family:var(--sans)}
svg .lbm{fill:var(--ink);font-size:10.5px;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px 4px;flex:none}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:3px 9px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--org)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--panel);border-color:var(--navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0A1330}
.chip.eng{border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);padding:2px 12px 6px;flex:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{position:sticky;top:0;background:var(--cellhead);text-align:left;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.tbl tr.hl td{background:var(--org-soft)}
.tbl tr:hover td{background:var(--chip)}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--chip);border:1px solid var(--line);white-space:nowrap}
.tag.o{background:var(--org-soft);border-color:var(--org);color:var(--org-ink)}
.tag.n{background:var(--navy);border-color:var(--navy);color:var(--panel)}
.tag.r{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.tiles{display:grid;gap:6px;padding:8px;flex:1}
.tile{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--chip);display:flex;flex-direction:column;justify-content:center;min-width:0}
.tile .v{font:600 clamp(16px,1.6vw,23px) var(--mono);color:var(--navy);line-height:1.1}
.tile .v.o{color:var(--org-ink)}
.tile .k{font-size:12px;font-weight:600;margin-top:2px}
.tile .s{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.prose{font-size:13px;line-height:1.5;padding:10px 12px}
.prose p{margin:0 0 8px}
.prose h3{font-size:13.5px;margin:10px 0 4px;color:var(--org-ink)}
.prose ul{margin:0 0 8px;padding-left:18px}
.prose li{margin:2px 0}
.formula{font-family:var(--mono);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:6px 0}
.formula .o{color:var(--org-ink);font-weight:600}

/* flow (stage map) */
.flow{display:grid;grid-template-rows:repeat(7,1fr);gap:5px;padding:8px;flex:1}
.fstep{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:4px 10px;cursor:pointer;background:var(--panel);position:relative;text-align:left}
.fstep:hover{border-color:var(--org)}
.fstep .num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--panel);display:grid;place-items:center;font-weight:700}
:root[data-theme="dark"] .fstep .num{color:#0A1330}
.fstep .t{font-weight:600;font-size:13px}
.fstep .d{font-size:11.5px;color:var(--muted);line-height:1.3}
.fstep .r{font:600 12px var(--mono);color:var(--org-ink);text-align:right;white-space:nowrap}
.fstep code{background:var(--chip);border-radius:4px;padding:0 4px;font-size:10.5px}

/* model cards */
.zoo{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:var(--gap);min-height:0}
.mcard{display:grid;grid-template-columns:34% 1fr;grid-template-rows:1fr auto;gap:2px 10px;padding:8px 10px}
.mcard .ic{grid-row:1/3;display:flex;align-items:center;justify-content:center;background:var(--chip);border-radius:8px;min-height:0;overflow:hidden}
.mcard .ic svg{width:100%;height:100%;max-height:150px}
.mcard h4{margin:0;font-size:14px}
.mcard .fam{font-size:11px;color:var(--muted)}
.mcard p{margin:4px 0;font-size:12px;line-height:1.4}
.mcard .set{font:11px var(--mono);color:var(--muted)}
.mcard .sc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* bars in html */
.hbar{display:grid;grid-template-columns:var(--lw,130px) 1fr 58px;align-items:center;gap:8px;font-size:12px;padding:2px 0}
.hbar .tr{height:12px;background:var(--grey-soft);border-radius:3px;position:relative;overflow:hidden}
.hbar .fl{position:absolute;top:0;bottom:0;left:0;background:var(--navy);border-radius:3px}
.hbar .vv{font:11.5px var(--mono);text-align:right}

/* predictor */
.inrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 12px;border-bottom:1px solid var(--line)}
.inrow label{font-size:12.5px;font-weight:600}
.inrow .val{font:600 12px var(--mono);color:var(--org-ink)}
.inrow input[type=range]{grid-column:1/3;width:100%;accent-color:var(--org);margin:2px 0}
.inrow .rng{grid-column:1/3;display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.seg{display:flex;gap:4px;grid-column:1/3}
.seg button{flex:1;border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:3px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--org);color:#fff;border-color:var(--org)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px 12px;flex:none;border-bottom:1px solid var(--line)}
.presets button{border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:4px 6px;cursor:pointer;font-size:11.5px;text-align:left;line-height:1.25}
.presets button:hover{border-color:var(--org)}
.presets button small{display:block;color:var(--muted);font-size:10.5px}
.grp h5{margin:6px 0 3px;font-size:12px}
.wi{border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin:6px 0;background:var(--chip)}
.wi b{color:var(--org-ink)}

/* walkthrough */
.walk td.on{background:var(--org-soft)!important;font-weight:600}
.walk td.dim,.walk th.dim{opacity:.25}
.stepdots{display:flex;gap:4px;align-items:center;margin-left:auto}
.stepdots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.stepdots button[aria-current="true"]{background:var(--org);width:22px;border-radius:5px}

/* architecture */
.arch{display:grid;grid-template-columns:1fr 26px 1.25fr 26px 1.25fr;grid-template-rows:1fr 1fr 1fr;gap:6px;padding:10px;flex:1;min-height:0}
.box{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--panel);font-size:12px;line-height:1.35;min-height:0;overflow:hidden}
.box h4{margin:0 0 3px;font-size:13px}
.box.n{border-color:var(--navy);background:var(--navy-soft)}
.box.o{border-color:var(--org);background:var(--org-soft)}
.box code{font-size:10.5px;background:var(--chip);border-radius:4px;padding:0 3px}
.arr{display:grid;place-items:center;color:var(--org);font-size:18px;font-weight:700}
.lane{display:grid;gap:6px;min-height:0}
.timeline{display:grid;gap:5px;padding:8px 12px}
.tl{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.tl .dot{width:22px;height:22px;border-radius:50%;background:var(--org-soft);border:2px solid var(--org);display:grid;place-items:center;font:600 11px var(--mono);color:var(--org-ink)}
.tl .tx{font-size:12.5px;line-height:1.4}
.tl .tx b{display:block}

@media (max-width:900px){
  body{overflow:auto;height:auto}
  .app{height:auto}
  header{grid-template-columns:auto 1fr auto;row-gap:6px}
  .stepper{grid-column:1/-1;grid-row:2;justify-content:space-between}
  .theme-btn{grid-column:3;grid-row:1}
  h1 small{display:none}
  .main{grid-template-columns:1fr}
  .side{max-height:34vh}
  .body{display:flex!important;flex-direction:column}
  .body>.panel{min-height:340px}
  .zoo{display:flex;flex-direction:column}
  .zoo .panel{min-height:200px}
  .arch{grid-template-columns:1fr;grid-template-rows:none}
  .arr{transform:rotate(90deg);height:20px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand" role="img" aria-label="GK">GK</span>
    <h1>Battery Clinic AI<small>Predictive analytics, visualized end to end</small></h1>
    <div class="stepper">
      <div class="where"><span id="whereStage"></span><b id="whereView"></b></div>
      <button class="pbtn" id="prevBtn" aria-label="Previous view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="pbtn primary" id="nextBtn" aria-label="Next view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>

    </aside>
    <div class="body" id="body"></div>
  </div>
  <footer class="site-foot">Built by Gopikrishna | <a href="mailto:gkrishna.ai.lab@gmail.com">gkrishna.ai.lab@gmail.com</a> | All numbers produced by running the project's own engine.py on data/battery_health.csv (v1, 3,000 rows)</footer>
</div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const AB = {'Battery Age': 'Age', 'Daily Usage Hours': 'Usage hrs', 'Gaming User': 'Gaming', 'Design Capacity': 'Design cap.', 'Cycle Count': 'Cycles',
  'CPU Usage': 'CPU', 'GPU Usage': 'GPU', 'Power Consumption': 'Power', 'Average Temperature': 'Temp', 'Full Charge Capacity': 'Full charge',

const corrT = Object.fromEntries(ALL.map((c, i) => [c, D.corr.m[i][ALL.length - 1]]));
const BANDC = {Good: 'var(--navy)', Moderate: 'var(--org)', Poor: 'var(--red)'};

const FAMILY = {'Linear Regression': 'lin', 'Ridge Regression': 'lin', 'K-Nearest Neighbors': 'oth', 'Decision Tree': 'tree', 'Random Forest': 'tree',
  'Extra Trees': 'tree', 'Gradient Boosting': 'tree', 'Hist Gradient Boosting': 'tree', 'Support Vector Regression': 'oth'};

function ticks(a, b, n = 5) {
  const span = (b - a) || 1, s0 = span / n, mag = 10 ** Math.floor(Math.log10(s0)), e = s0 / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag, out = [];
  for (let v = Math.ceil(a / step - 1e-9) * step; v <= b + step * 1e-6; v += step) out.push(+v.toFixed(10));
  return out;
}
/* frame: measured SVG with scales and axes */
function frame(el, o) {
  const w = Math.max(el.clientWidth, 60), h = Math.max(el.clientHeight, 60);
  const m = Object.assign({l: 44, r: 12, t: 10, b: o.xl ? 34 : 22}, o.m || {});
  const X = v => m.l + (v - o.x[0]) / ((o.x[1] - o.x[0]) || 1) * (w - m.l - m.r);
  const Y = v => h - m.b - (v - o.y[0]) / ((o.y[1] - o.y[0]) || 1) * (h - m.t - m.b);
  let ax = '';
  if (o.yt !== false) (o.yticks || ticks(o.y[0], o.y[1], o.yn || Math.max(2, Math.floor((h - m.t - m.b) / 46)))).forEach(t => {
    ax += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(t)}" y2="${Y(t)}" class="gl"/><text x="${m.l - 6}" y="${Y(t) + 3.5}" class="tk" text-anchor="end">${(o.yf || sh)(t)}</text>`; });
  if (o.xt !== false) (o.xticks || ticks(o.x[0], o.x[1], o.xn || Math.max(2, Math.floor((w - m.l - m.r) / 80)))).forEach(t => {
    if (o.xgrid) ax += `<line y1="${m.t}" y2="${h - m.b}" x1="${X(t)}" x2="${X(t)}" class="gl"/>`;
    ax += `<text x="${X(t)}" y="${h - m.b + 14}" class="tk" text-anchor="middle">${(o.xf || sh)(t)}</text>`; });
  ax += `<line x1="${m.l}" x2="${w - m.r}" y1="${h - m.b}" y2="${h - m.b}" class="ax"/>`;
  if (o.xl) ax += `<text x="${(m.l + w - m.r) / 2}" y="${h - 4}" class="al" text-anchor="middle">${esc(o.xl)}</text>`;
  if (o.yl) ax += `<text transform="translate(11 ${(m.t + h - m.b) / 2}) rotate(-90)" class="al" text-anchor="middle">${esc(o.yl)}</text>`;
  return {w, h, m, X, Y, wrap: inner => `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${ax}${inner}</svg>`};
}
const put = (el, html) => { el.innerHTML = html; };
const cv = (id, extra = '') => `<div class="cv" id="${id}" ${extra}></div>`;

/* histogram (numeric or binary) */
function histChart(el, c, o = {}) {
  const H = D.hists[c];
  if (H.binary) {
    const mx = Math.max(...H.counts);
    const f = frame(el, {x: [0, 2], y: [0, mx * 1.12], xt: false, yl: o.small ? null : 'Laptops', m: o.small ? {l: 4, r: 4, t: 4, b: 14} : {}, yt: !o.small});
    let s = ''; H.counts.forEach((n, i) => { const x0 = f.X(i + .18), x1 = f.X(i + .82);
      s += `<rect x="${x0}" y="${f.Y(n)}" width="${x1 - x0}" height="${f.Y(0) - f.Y(n)}" rx="3" style="fill:${i ? 'var(--org)' : 'var(--navy)'}"/>`;
      s += `<text x="${(x0 + x1) / 2}" y="${f.h - f.m.b + (o.small ? 11 : 14)}" class="tk" text-anchor="middle">${H.labels[i]}${o.small ? '' : ' (' + n.toLocaleString() + ')'}</text>`; });
    return put(el, f.wrap(s));
  }
  const e = H.edges, mx = Math.max(...H.counts);
  const sm = o.small, boxH = sm ? 0 : 16;
  const f = frame(el, {x: [e[0], e[e.length - 1]], y: [0, mx * 1.08], yl: sm ? null : 'Laptops', xl: sm ? null : (o.xl || c + (unit(c) ? ` (${unit(c)})` : '')),
    m: sm ? {l: 4, r: 4, t: 4, b: 4} : {b: 38 + boxH}, yt: !sm, xt: !sm});
  let s = '';
  H.counts.forEach((n, i) => { const x0 = f.X(e[i]) + .6, x1 = f.X(e[i + 1]) - .6; const mid = (e[i] + e[i + 1]) / 2;
    const col = o.bands ? BANDC[band(mid)] : (o.color || 'var(--navy)');
    s += `<rect x="${x0}" y="${f.Y(n)}" width="${Math.max(x1 - x0, .5)}" height="${f.Y(0) - f.Y(n)}" style="fill:${col}" opacity=".85"><title>${sh(e[i])}–${sh(e[i + 1])}: ${n} laptops</title></rect>`; });
  if (!sm) {
    const q = H.q, y0 = f.h - f.m.b + 19, yc = y0 + boxH / 2;
    s += `<line x1="${f.X(q[0])}" x2="${f.X(q[4])}" y1="${yc}" y2="${yc}" style="stroke:var(--grey)"/>`;
    s += `<rect x="${f.X(q[1])}" y="${y0 + 2}" width="${f.X(q[3]) - f.X(q[1])}" height="${boxH - 4}" rx="3" style="fill:var(--org-soft);stroke:var(--org)"/>`;
    s += `<line x1="${f.X(q[2])}" x2="${f.X(q[2])}" y1="${y0 + 1}" y2="${y0 + boxH - 1}" style="stroke:var(--org-ink);stroke-width:2.5"/>`;
    const u = UNI[c]; if (u) { s += `<line x1="${f.X(u.Mean)}" x2="${f.X(u.Mean)}" y1="${f.m.t}" y2="${f.Y(0)}" style="stroke:var(--org);stroke-dasharray:4 3;stroke-width:1.5"/>`;
      s += `<text x="${f.X(u.Mean) + 4}" y="${f.m.t + 10}" class="lb" style="fill:var(--org-ink)">mean ${sh(u.Mean)}</text>`; }
  } else if (UNI[c]) s += `<line x1="${f.X(UNI[c].Median)}" x2="${f.X(UNI[c].Median)}" y1="2" y2="${f.h - 2}" style="stroke:var(--org);stroke-width:1.5"/>`;

}
/* horizontal bars (svg, measured) */
function hbars(el, items, o = {}) {
  const w = el.clientWidth, n = items.length; const lw = o.lw || Math.min(150, Math.max(...items.map(d => d.l.length)) * 6.4 + 8);
  const vals = items.flatMap(d => [d.v, d.v - (d.e || 0), d.v + (d.e || 0)]).concat(o.ref ? o.ref.map(r => r.v) : []);
  let lo = o.min != null ? o.min : Math.min(0, ...vals), hi = o.max != null ? o.max : Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const f = frame(el, {x: [lo, hi], y: [0, n], yt: false, m: {l: lw, r: o.r || 46, t: o.t || 6, b: 20}, xf: o.xf, xgrid: true});
  const bh = Math.min(22, (f.Y(0) - f.Y(1)) * .68); let s = '';

/* line chart */
function lines(el, series, o = {}) {
  const xs = series.flatMap(s => s.x), ys = series.flatMap(s => s.y);
  const x = o.x || [Math.min(...xs), Math.max(...xs)], y = o.y || [Math.min(...ys), Math.max(...ys)];
  const f = frame(el, Object.assign({x, y}, o)); let s = '';

  series.forEach(se => { const p = se.x.map((v, i) => `${f.X(v)},${f.Y(se.y[i])}`).join(' ');
    s += `<polyline points="${p}" fill="none" style="stroke:${se.c};stroke-width:${se.wd || 2.2}" ${se.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
    if (se.dots !== false) se.x.forEach((v, i) => s += `<circle cx="${f.X(v)}" cy="${f.Y(se.y[i])}" r="3" style="fill:${se.c}"><title>${se.name}: ${sh(v)} → ${nf(se.y[i], 3)}</title></circle>`); });
  (o.marks || []).forEach(mk => s += `<circle cx="${f.X(mk.x)}" cy="${f.Y(mk.y)}" r="6" style="fill:none;stroke:var(--org);stroke-width:2"/><text x="${f.X(mk.x) + 8}" y="${f.Y(mk.y) + 18}" class="lb" style="fill:var(--org-ink)">${esc(mk.t)}</text>`);
  put(el, f.wrap(s));
}

function scatter(el, pts, o = {}) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = (a, b) => { const d = (b - a) * .04 || 1; return [a - d, b + d]; };
  const x = o.x || pad(Math.min(...xs), Math.max(...xs)), y = o.y || pad(Math.min(...ys), Math.max(...ys));
  const f = frame(el, Object.assign({x, y}, o)); let s = '';
  if (o.band) s += `<polygon points="${f.X(x[0])},${f.Y(x[0] + o.band)} ${f.X(x[1])},${f.Y(x[1] + o.band)} ${f.X(x[1])},${f.Y(x[1] - o.band)} ${f.X(x[0])},${f.Y(x[0] - o.band)}" style="fill:var(--org-soft)" opacity=".8"/>`;
  if (o.diag) s += `<line x1="${f.X(x[0])}" y1="${f.Y(x[0])}" x2="${f.X(x[1])}" y2="${f.Y(x[1])}" style="stroke:var(--org);stroke-width:1.6"/>`;
  pts.forEach((p, i) => { const jx = o.jitter ? ((i * 7919 % 100) / 100 - .5) * o.jitter : 0;
    s += `<circle cx="${f.X(p[0] + jx)}" cy="${f.Y(p[1])}" r="${o.r || 2.4}" style="fill:${o.c || 'var(--navy)'}" opacity="${o.op || .38}"/>`; });
  if (o.over) { s += `<polyline points="${o.over.map(p => `${f.X(p[0])},${f.Y(p[1])}`).join(' ')}" fill="none" style="stroke:var(--org);stroke-width:3"/>`;
    o.over.forEach(p => s += `<circle cx="${f.X(p[0])}" cy="${f.Y(p[1])}" r="4" style="fill:var(--org);stroke:var(--panel);stroke-width:1.5"/>`); }
  put(el, f.wrap(s));
}
const binLbl = l => l.includes('–') ? l.split('–').map(x => sh(parseFloat(x.replace(/,/g, '')))).join('–') : l;
function vbars(el, items, o = {}) {
  const mx = o.max || Math.max(...items.map(d => d.v)), mn = o.min != null ? o.min : 0;
  const f = frame(el, Object.assign({x: [0, items.length], y: [mn, mx * 1.06], xt: false}, o)); let s = '';
  const bw = (f.X(1) - f.X(0)) * .72;
  items.forEach((d, i) => { const xc = f.X(i + .5);
    s += `<rect x="${xc - bw / 2}" y="${f.Y(d.v)}" width="${bw}" height="${f.Y(mn) - f.Y(d.v)}" rx="3" style="fill:${d.c || 'var(--navy)'}"><title>${esc(d.l)}: ${nf(d.v, 2)}</title></rect>`;
    if (bw > 22) s += `<text x="${xc}" y="${f.Y(d.v) - 4}" class="lbm" text-anchor="middle">${nf(d.v, o.dp ?? 1)}</text>`;
    s += `<text x="${xc}" y="${f.h - f.m.b + 13}" class="tk" text-anchor="middle">${esc(d.l)}</text>`; });
  put(el, f.wrap(s));
}

/* preprocessing walkthrough */
const FM = D.final_model;
const WALK_ROW = D.examples[1].row;
const WSTEPS = [
  {t: 'Raw inputs', d: 'One real laptop from the data (the one closest to median health). These are the 9 values the model sees.'},
  {t: 'Fill gaps with the median', d: 'SimpleImputer(strategy="median"). Each column\'s training median replaces a missing value. This laptop has none, so nothing changes; it protects uploads with blanks.'},
  {t: 'Standardise', d: 'StandardScaler: z = (value − mean) ÷ std. Every input now speaks the same unit, "standard deviations from average", so a 1,000-cycle gap and a 5 °C gap become comparable and Ridge\'s penalty treats them fairly.'},
  {t: 'Weight each input', d: 'Ridge multiplies each z by its learned weight. Weights are in health points per one standard deviation: Cycle Count −5.29 means one std more cycles costs about 5.3 points.'},
  {t: 'Add up', d: 'Prediction = intercept (the average health, 82.52) + sum of contributions, then clipped to 0–100. This is exactly what the app computes for this laptop.'},
];
function walkVals() {
  return FM.features.map((c, i) => { const raw = WALK_ROW[c], imp = raw == null ? FM.median[i] : raw, z = (imp - FM.mean[i]) / FM.scale[i];
    return {c, raw, med: FM.median[i], mean: FM.mean[i], sd: FM.scale[i], z, w: FM.coef[i], contrib: z * FM.coef[i]}; });
}
function stopWalk() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

const TYP = D.surrogate.typical;
function predict(row) { let s = FM.intercept; FM.features.forEach((f, i) => s += FM.coef[i] * (((row[f] ?? FM.median[i]) - FM.mean[i]) / FM.scale[i])); return clamp(s, 0, 100); }
function engVals(r) { const age = r['Battery Age'] > 0 ? r['Battery Age'] : NaN, hrs = r['Daily Usage Hours'] > 0 ? r['Daily Usage Hours'] : NaN;
  return {'Cycles per Year': r['Cycle Count'] / age, 'Heat Stress': r['Average Temperature'] * r['Daily Usage Hours'], 'Workload Intensity': (r['CPU Usage'] + r['GPU Usage']) / 2,
    'Power per Usage Hour': r['Power Consumption'] / hrs, 'Gaming Load': r['Gaming User'] * r['GPU Usage']}; }
function explainRow(row) {
  const fin = predict(row), base = predict(TYP);
  const drv = BASE.map(c => ({c, v: row[c], typ: TYP[c], e: fin - predict(Object.assign({}, row, {[c]: TYP[c]}))})).sort((a, b) => Math.abs(b.e) - Math.abs(a.e));
  const steps = drv.filter(d => Math.abs(d.e) >= .05).slice(0, 6), other = fin - base - steps.reduce((a, d) => a + d.e, 0);
  const neg = drv.filter(d => d.e <= -.5), pos = drv.filter(d => d.e >= .5), bd = band(fin);
  const lines = [`Estimated battery health is <b>${nf(fin, 1)}%</b> (${bd}).`];
  if (neg.length) lines.push(`Pulling it down most, compared with a typical laptop: ${neg.slice(0, 2).map(d => `<b>${d.c}</b> (${nf(d.e, 1)} points)`).join(' and ')}.`);
  if (pos.length) lines.push(`Working in its favour: <b>${pos[0].c}</b> (+${nf(pos[0].e, 1)} points).`);
  if (!neg.length && !pos.length) lines.push('All inputs are close to typical values, so no single factor stands out.');
  const ev = engVals(row), comps = BASE.filter(c => c !== 'Gaming User').map(c => ({c, v: row[c]})).concat(ENG.map(c => ({c, v: ev[c]}))).filter(x => !isNaN(x.v))
    .map(x => { const p = pctOf(D.quant[x.c], x.v); return Object.assign(x, {p, lvl: p >= 80 ? 'high' : p <= 20 ? 'low' : 'typical'}); });
  const negCols = new Set(neg.slice(0, 3).map(d => d.c));
  const notable = comps.find(x => ENG.includes(x.c) && x.lvl === 'high' && D.engineered_meta[x.c][1].some(s => negCols.has(s)));
  if (notable) lines.push(`${notable.c} is higher than ${nf(notable.p, 0)}% of laptops in the dataset.`);
  const groups = {Concerns: [], Normal: [], 'In your favour': []};
  comps.forEach(x => { const r = corrT[x.c]; if (x.lvl === 'typical' || Math.abs(r) < .05) groups.Normal.push(x); else if ((x.lvl === 'high') === (r < 0)) groups.Concerns.push(x); else groups['In your favour'].push(x); });
  const whatif = drv.filter(d => d.e <= -.5 && D.changeable.includes(d.c)).slice(0, 3).map(d => ({c: d.c, v: d.v, typ: d.typ, nw: Math.min(fin - d.e, 100), gain: -d.e}));
  const advice = neg.slice(0, 2).map(d => D.advice[d.c]).filter(Boolean);
  return {fin, base, steps, other, lines, groups, whatif, advice, bd};
}

      if (i < segs.length - 1) s += `<line x1="${xc + bw / 2}" x2="${f.X(i + 1.5) - bw / 2}" y1="${f.Y(g.b)}" y2="${f.Y(g.b)}" style="stroke:var(--grey);stroke-dasharray:2 2"/>`;
      s += `<text x="${xc}" y="${y1 - 4}" class="lbm" text-anchor="middle">${g.abs ? nf(g.b, 1) : (g.d >= 0 ? '+' : '') + nf(g.d, 1)}</text><text x="${xc}" y="${f.h - f.m.b + 14}" class="tk" text-anchor="middle">${esc(g.l)}</text>`; });
    put(el, f.wrap(s)); }},
  {a: 'cmp', t: 'Compared with 3,000 laptops', h: 'Percentile of each value; direction from its link with health', r: b => {
    const X = explainRow(S.row), G = X.groups;
    const row = x => `<div class="hbar" style="--lw:128px;grid-template-columns:128px 1fr 44px"><span>${AB[x.c]}${ENG.includes(x.c) ? ' *' : ''}</span><span class="tr" style="overflow:visible"><span style="position:absolute;left:20%;right:20%;top:0;bottom:0;background:var(--chip)"></span><span style="position:absolute;top:-2px;bottom:-2px;width:4px;border-radius:2px;left:calc(${x.p}% - 2px);background:var(--ink)"></span></span><span class="vv">P${nf(x.p, 0)}</span></div>`;
    put(b, `<div class="pad grp">${[['Concerns', 'var(--org-ink)'], ['In your favour', 'var(--navy)'], ['Normal', 'var(--muted)']].map(([k, c]) => G[k].length ? `<h5 style="color:${c}">${k} (${G[k].length})</h5>${G[k].map(row).join('')}` : '').join('')}
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Shaded band = typical (P20 to P80). * calculated attribute.</div></div>`); }},
  {a: 'wi', t: 'What could change it', h: 'engine.what_if(): changeable habits only', r: b => {
    const X = explainRow(S.row);
    put(b, `<div class="pad">${X.whatif.length ? X.whatif.map(w => `<div class="wi">If <b>${w.c}</b> went from ${fmtIn(w.c, w.v)} to the typical ${fmtIn(w.c, w.typ)}, predicted health would be <b>${nf(w.nw, 1)}%</b> (+${nf(w.gain, 1)} points).</div>`).join('')
      : '<div class="wi">No changeable habit is pulling health down by more than 0.5 points. Age and cycle count reflect history and cannot be changed.</div>'}
      ${X.advice.map(a => `<div style="font-size:12px;margin:6px 0;color:var(--muted)">${esc(a)}</div>`).join('')}</div>
      <div style="padding:0 12px 6px;font-size:12px;font-weight:600">Habit levers in the model: effect of a +1 unit change</div>` +
      table([{t: 'Habit', f: r => esc(r.c)}, {t: '+1 unit', f: r => esc(r.u)}, {t: 'Health change', n: 1, f: r => `<span style="color:${r.d < 0 ? 'var(--org-ink)' : 'var(--navy)'}">${(r.d >= 0 ? '+' : '') + nf(r.d, 3)} pts</span>`}],
        D.changeable.map(c => { const i = FM.features.indexOf(c); return {c, u: c === 'Gaming User' ? 'non-gamer → gamer' : D.features_meta[c].unit || 'unit', d: FM.coef[i] / FM.scale[i]}; }).sort((a, b) => a.d - b.d))); },
    note: 'Health is computed in your browser with the final model\'s exact scaler and weights, refit on all 3,000 rows.'},
]});

/* ================= Stage 7: deployment ================= */

    {t: 'Share', f: r => `<div class="hbar" style="--lw:0px;grid-template-columns:1fr;padding:0"><span class="tr"><span class="fl" style="width:${r[1] / 1726 * 100}%;background:var(--org)"></span></span></div>`}, {t: 'Purpose', f: r => esc(r[2])}], D.files) + tiles([{v: '3,993', k: 'Lines of Python'}, {v: '6', k: 'App pages'}, {v: '9', k: 'Models compared'}, {v: '7', k: 'Dependencies', o: 1, s: 'plus 2 optional'}], 2))},

    ${[['Run locally', '<code>conda create -n batterysense python=3.11</code><br><code>pip install -r requirements.txt</code><br><code>python -m streamlit run app.py</code>'],
      ['Push to GitHub', 'secrets.toml is git-ignored, so keys never leave the machine'], ['Create the app', 'share.streamlit.io → New app → point to <code>app.py</code>'],
      ['Paste secrets', 'App Settings → Secrets. Each push to the repo redeploys the app']].map((x, i) => `<div class="box ${i === 3 ? 'o' : ''}" style="display:flex;flex-direction:column;gap:4px"><span class="tag ${i === 3 ? 'o' : 'n'}" style="align-self:flex-start">Step ${i + 1}</span><h4>${x[0]}</h4><div>${x[1]}</div></div>`).join('')}</div>`)},
  {a: 'secrets', t: 'Optional secrets', h: '.streamlit/secrets.toml', r: b => put(b, table([{t: 'Key', f: r => `<code>${r[0]}</code>`}, {t: 'Turns on', f: r => r[1]}, {t: 'Without it', f: r => r[2]}],
    [['ANTHROPIC_API_KEY', 'Mr. GK AI mode', 'Guide mode (free, built-in knowledge base)'], ['GITHUB_TOKEN', 'Data versions saved to the repo', 'Versions kept on the app\'s disk only'], ['GITHUB_REPO', 'Target repo for versions', 'Same as above']]))},
]});

/* ================= init ================= */
function syncInputs(b, skipRanges) { BASE.forEach(c => { const id = c.replace(/ /g, '_'), v = S.row[c]; const lab = b.querySelector('#v_' + id); if (lab) lab.textContent = fmtIn(c, v);
  const sl = b.querySelector('#s_' + id); if (sl && !skipRanges) sl.value = v; });
  b.querySelectorAll('[data-bin]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.bin === S.row['Gaming User'])); }
const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function setThemeIcon() { $('#themeBtn').innerHTML = isDark() ? sun : moon; $('#themeBtn').setAttribute('aria-label', isDark() ? 'Switch to light theme' : 'Switch to dark theme'); }
$('#themeBtn').onclick = () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('bcai-theme', document.documentElement.dataset.theme); } catch (e) {} setThemeIcon(); };
try { const t = localStorage.getItem('bcai-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
setThemeIcon();
const go = d => { const i = ORDER.indexOf(S.view) + d; if (i >= 0 && i < ORDER.length) render(ORDER[i]); };
$('#prevBtn').onclick = () => go(-1); $('#nextBtn').onclick = () => go(1);
document.addEventListener('keydown', e => { if (e.target.matches('input,textarea')) return; if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => redraw(), 120); }).observe($('#body'));
buildNav();
const start = (location.hash || '').slice(1);
render(VIEWS[start] ? start : 'brief');
if (document.fonts) document.fonts.ready.then(() => redraw());
